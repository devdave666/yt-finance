beats:
- id: b01
  scene: s_b01
  say: Three ETFs that beat the S&P 500, and they have genuinely crushed it.
- id: b02
  scene: s_b02
  say: The S&P 500 gained seventeen point two eight percent over the past year,
    but these three left it in the dust.
- id: b03
  scene: s_b03
  say: 'Number one: SPMO. It holds the 100 stocks in the S&P 500 showing the
    strongest momentum right now.'
- id: b04
  scene: s_b04
  say: It rebalances every single quarter to stay current.
- id: b05
  scene: s_b05
  say: Its expense ratio is just zero point one three percent, and its one
    year return sits at twenty five point seven one percent.
- id: b06
  scene: s_b06
  say: 'Number two: MTUM. It targets the large and mid-cap U.S. stocks with
    the fastest momentum across the market, rebalancing regularly so you''re
    always riding the strongest trends.'
- id: b07
  scene: s_b07
  say: Its expense ratio is zero point one five percent, and its one year
    return comes in at twenty three point four eight percent.
- id: b08
  scene: s_b08
  say: 'Number three: VGT. It''s loaded with tech giants -- mostly
    semiconductor makers and software leaders like Apple, Microsoft, and
    NVIDIA.'
- id: b09
  scene: s_b09
  say: Its expense ratio is the lowest of the three at zero point zero nine
    percent, and its one year return hit thirty five point zero six percent.
