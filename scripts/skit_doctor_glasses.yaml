title: "Who's Calling Me Stupid Now"
slug: skit-doctor-glasses
format: short
caption_style: title
title_card: 'POV: "Who calls me stupid now?" 😂'
# music: assets/lofi.mp3

cast:
  patient:
    voice: Orus
    look: >
      a sharp, fully-illustrated flat-vector character, not a stick figure.
      The head is a completely FLAT, BLANK round head like a plain cream-white
      egg or balloon -- absolutely NO skin tone, NO shading, NO jawline, NO
      cheeks, NO chin contour, NO ears, NO nose, and NO realistic human face
      structure of any kind. Only these features sit directly on that flat
      circle: a few bold spiky black hair strands, two small solid-black dot
      eyes, two short sharp angled eyebrows, and a clearly drawn mouth that
      always reads the expression. He wears a plain rust-orange hoodie,
      ordinary blue jeans, and grey sneakers. Flat colour fills, bold clean
      black outlines, light cel-shading for form -- never a bare line figure.
    anchor: left
  doctor:
    voice: Aoede
    look: >
      a sharp, fully-illustrated flat-vector character, not a stick figure.
      The head is a completely FLAT, BLANK round head like a plain cream-white
      egg or balloon -- absolutely NO skin tone, NO shading, NO jawline, NO
      cheeks, NO chin contour, NO ears, NO nose, and NO realistic human face
      structure of any kind. Only these features sit directly on that flat
      circle: a few bold spiky black hair strands, two small solid-black dot
      eyes, two short sharp angled eyebrows, and a clearly drawn calm mouth.
      She wears a white lab coat over a light-blue collared shirt, dark navy
      trousers, plain black flats, and a small grey stethoscope around the
      neck. Flat colour fills, bold clean black outlines, light cel-shading
      for form -- never a bare line figure.
    anchor: right

scenes:
  office:
    color: "#f4efe4"

beats:
  - id: b1
    scene: office
    who: patient
    say: "Doctor, I can't read anything up close any more. Is my brain broken?"
    cast:
      patient: "sitting on the chair, leaning forward, worried face"
      doctor: "sitting at the desk, listening, neutral face"

  - id: b2
    scene: office
    who: doctor
    say: "No. Your brain is fine. Try these."
    cast:
      patient: "sitting, blank neutral face"
      doctor: "sitting, holding out a pair of glasses in one hand, faint smile"
    props: [glasses]

  - id: b3
    scene: office
    who: patient
    say: "Wait. So I just needed glasses this whole time?"
    cast:
      patient: "sitting, holding the glasses up, examining them, curious face"
      doctor: "sitting, neutral face"

  - id: b4
    scene: office
    who: patient
    say: "Who's calling me stupid now?"
    cast:
      patient: "standing, arms crossed, wearing the glasses, smug grin"
      doctor: "sitting, confused face, one eyebrow raised"

