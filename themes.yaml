# The channel's content space. The generator reads this, picks the next topic
# (round-robin, skipping anything used in the last `cooldown` videos), decides
# explainer vs skit, and writes a full script YAML. Edit this file to steer the
# channel; everything downstream is hands-off.

channel: "Anti Broke (@AntiBrokee)"

niche: >
  Personal finance for people who want to stop being broke -- but the LESS
  obvious stuff. Not "what is a budget". The mechanics and gotchas most people
  never had explained: how a rule actually works, the trap hidden in the fine
  print, the counterintuitive thing that's true anyway. One sharp idea per
  short. Chosen for monetisation -- finance has among the highest ad RPMs on
  YouTube, the topics are evergreen, and the content is advertiser-safe.

voice: >
  Dry, quick, a little sarcastic. The humour comes from calling out how absurd
  or rigged the thing is -- not from jokes or puns. Punchy one-liners, a
  knowing smirk, zero fluff. Confident, never hypey, never mean. Think a smart
  friend who finds this stuff genuinely funny and slightly infuriating.

# Hard rules the generator must follow (also enforced in generate.py):
rules:
  - Never recommend a specific stock, crypto, fund ticker, or financial product to buy.
  - Never promise returns or use hype ("get rich", "this one trick", "banks hate this").
  - No individualized investment, tax, or legal advice -- general education only.
  - Keep it accurate. If a number or rule is cited, it must be correct.
  - Sarcasm is aimed at systems and fine print, never at the viewer.
  - Every video ends on a calm, useful takeaway (dry, not a hard sell).

formats: [explainer, skit]     # the generator picks one per video based on the topic
cooldown: 14                   # don't reuse a topic until this many videos have passed

topics:
  - Carrying any card balance kills the interest-free grace period on new purchases
  - The 0% long-term capital gains bracket -- selling winners tax-free in a low-income year
  - An HSA is the only triple-tax-free account, and you can invest it instead of spending it
  - FDIC insurance can cover far more than $250k at one bank via ownership categories
  - Credit utilization is scored per card, not just across all your cards combined
  - Deferred-interest store financing -- "same as cash" until you miss the date, then it all backdates
  - The Rule of 72, and why 114 triples your money and 144 quadruples it
  - Sequence-of-returns risk -- a crash early in retirement hurts far more than a later one
  - Your 401k's expense ratio can quietly eat a third of your lifetime returns
  - Target-date funds are great in a 401k and tax-messy in a regular brokerage account
  - Money market funds vs high-yield savings -- similar yield, different risk and access
  - Beneficiary designations on your accounts override whatever your will says
  - I bonds -- government savings bonds whose rate tracks inflation, with a yearly cap
  - The wash-sale rule -- no tax loss if you rebuy the same thing within 30 days
  - Municipal bond interest is federal-tax-free, so a lower rate can still win
  - A Roth's quiet superpower -- your contributions come back out anytime, penalty-free
  - Card minimum payments are engineered so a balance can take decades to clear
  - Balance transfers advertised at zero percent APR almost always carry a 3 to 5 percent upfront fee
  - 401k match vesting -- leave too early and you forfeit part of the free money
  - Investing a lump sum now beats dollar-cost-averaging it in, most of the time historically
  - Your effective tax rate is way below your bracket, because brackets are marginal
  - A credit score has nothing to do with your income or how much money you have
  - Paying rent on time builds zero credit unless you specifically enrol it
  - Closing your oldest credit card can drop your score by shortening your history
  - How term and whole life insurance differ, and why term costs a fraction as much
  - Overdraft "protection" is usually a very expensive loan you opted into
  - The debt avalanche saves more; the debt snowball is just easier to stick with
  - Brokered CDs pay more than bank CDs but can lose value if you sell early
  - A 15-year vs 30-year mortgage -- the rate gap and the payment gap people miss
  - How a no-fee checking account still makes the bank plenty of money off you
