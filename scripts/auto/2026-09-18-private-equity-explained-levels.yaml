  s_b02:
    bg: 'Eye-level medium shot. An older man in a modest cardigan, Bill, sits across
      a small kitchen table from Sarah. Warm afternoon light, a cosy but plain kitchen
      with real detail: patterned wallpaper, a fruit bowl, family photos on the wall.'
  s_b03:
    bg: Close-up on Bill's hand placing a crisp five-pound note into Sarah's open
      palm across the wooden kitchen table.
  s_b04:
    bg: Tight medium shot on Sarah, a small confident smirk, holding the five-pound
      note up beside her face. In the top corner of the frame, a bold clean graphic
