beats:
- id: b01
  scene: s_b01
  say: You missed SanDisk. Don't miss what's coming next.
- id: b02
  scene: s_b02
  say: If you'd put one thousand dollars into SanDisk about a year ago, it would
    be worth roughly twenty five thousand dollars today.
- id: b03
  scene: s_b03
  say: And the next big opportunity isn't AI itself. It's the layer underneath
    -- robotics.
- id: b04
  scene: s_b04
  say: NVIDIA's CEO has already called robotics the next stage of the AI trade.
- id: b05
  scene: s_b05
  say: Here's the part everyone's overlooking -- actuators. They're the muscles
    and joints that let a robot move with nanometer precision.
- id: b06
  scene: s_b06
  say: One advanced humanoid robot needs dozens of them, and actuators can make
    up as much as seventy percent of the total cost to build a single robot.
- id: b07
  scene: s_b07
  say: If Tesla scales Optimus production the way it's planned, analysts expect
    spending on actuators to run into the billions.
- id: b08
  scene: s_b08
  say: Three suppliers dominate this market. First, China's Sanhua Intelligent
    Controls -- reportedly locked in for a six hundred eighty five million dollar
    actuator order from Tesla.
- id: b09
  scene: s_b09
  say: Second, Japan's Harmonic Drive Systems -- the company that invented the
    precision gearing nearly every robot joint on Earth still depends on.
- id: b10
  scene: s_b10
  say: Third, America's MP Materials. Their magnets are the foundation, because
    a single humanoid robot can carry significantly more rare earth magnet
    content than an entire EV.
- id: b11
  scene: s_b11
  say: MP Materials isn't just part of the robotics trade. It essentially is
    the robotics trade.
  emphasis: true
- id: b12
  scene: s_b12
  say: Follow Anti Broke for daily money insights.
