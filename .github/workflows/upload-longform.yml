name: Upload Long-form

# Upload a committed media/<slug>.mp4 straight to YouTube with the Data API.
#
# NOT Buffer: Buffer's YouTube integration on this channel is Shorts-only
# (<=3 min, vertical) and has no post-type field, so it cannot accept a
# landscape long-form video at all. See tools/upload_longform.py.
#
# Needs YOUTUBE_CLIENT_ID / YOUTUBE_CLIENT_SECRET / YOUTUBE_REFRESH_TOKEN
# secrets -- run tools/youtube_auth.py once to mint them (see SETUP.md).

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "media/<slug>.mp4 to upload"
        type: string
        required: true
      title:
        description: "YouTube title (<=100 chars)"
        type: string
        required: true
      description:
        description: "YouTube description"
        type: string
        required: false
        default: ""
      tags:
        description: "comma-separated tags"
        type: string
        required: false
        default: ""
      privacy:
        description: "YouTube privacy"
        type: choice
        options: [unlisted, private, public]
        default: unlisted
      synthetic:
        description: "Declare altered/synthetic content (AI narration)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: youtube-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install google-api-python-client google-auth-oauthlib

      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python tools/youtube_upload.py "media/${{ inputs.slug }}.mp4" \
            --title "${{ inputs.title }}" \
            --description "${{ inputs.description }}" \
            --tags "${{ inputs.tags }}" \
            --privacy "${{ inputs.privacy }}" \
            ${{ inputs.synthetic && '--synthetic' || '' }}
