title_card: STOP ASKING CHATGPT FOR MONEY ADVICE.
cinematic: true
narrator:
  voice: Aoede
tts_style: You're talking directly to a friend about money -- warm, natural, conversational
  pace. Real pauses between thoughts, natural emphasis on the words that matter, like
  you genuinely mean it. Not a pitch, not brisk news-anchor energy -- unhurried and
  sincere. Read the line exactly once, word for word, and stop at the end -- never
  repeat or restart a word or phrase.
