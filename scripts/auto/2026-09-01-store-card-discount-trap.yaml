title: How Stores Trick You Into "Saving" Money
slug: 2026-09-01-store-card-discount-trap
format: short
caption_style: title
title_card: The 'Discount' That Costs You Money 🤑
cast:
  alex:
    look: 'the ''Anti Broke'' host: a minimalist black-marker stick figure with a
      round OPEN white head, four or five short spiky lines of hair on top, two small
      dot eyes, two short sharp angled eyebrows, and always a visible mouth that shows
      the expression (flat, frown, grimace, open shout). The body is ONE single straight
      vertical black line (spine), with four more single straight black lines for
      the two arms and two legs, dot hands, short line feet -- plus one small thin
      necktie shape (a short strip + a little triangle) hanging at the neck. NO torso
      shape, NO filled body, NO solid black wedge, NO shirt block -- the figure is
      a head, spiky hair, five thin lines and a skinny tie. It is never a black silhouette.'
    anchor: left
    voice: Orus
  chloe:
    look: 'a classic minimalist stick figure like the host but drawn slightly shorter,
      same construction: round open white head, ONE straight vertical line for the
      spine, single straight lines for arms and legs, dot hands. No torso shape, no
      fill, no silhouette. A small plain teal collar is the only difference from the
      host.'
    anchor: right
    voice: Aoede
scenes:
  living_room:
    bg: A simple 2D vector background of a living room. Contains a simple couch on
      one side and a floor lamp on the other. Flat, neutral colors.
