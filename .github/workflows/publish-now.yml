name: Publish Now

# One-off: publish an already-committed media/<slug>.mp4 immediately to
# YouTube + Instagram + TikTok via Buffer, bypassing state/queue.json.
# The queue is FIFO and can have a real backlog -- this is for "this specific
# short, live, now" (see tools/publish_now.py for why).

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "media/<slug>.mp4 to publish"
        type: string
        required: true
      title:
        description: "Title (YouTube)"
        type: string
        required: true
      description:
        description: "Description / caption (all platforms)"
        type: string
        required: false
        default: ""
      skip_instagram:
        type: boolean
        default: false
      skip_tiktok:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Publish
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          SLUG: ${{ inputs.slug }}
          TITLE: ${{ inputs.title }}
          DESCRIPTION: ${{ inputs.description }}
          SKIP_INSTAGRAM: ${{ inputs.skip_instagram }}
          SKIP_TIKTOK: ${{ inputs.skip_tiktok }}
        # Inputs go through env vars, not direct ${{ }} interpolation into this
        # script -- GitHub substitutes ${{ inputs.description }} as raw text
        # BEFORE bash ever runs, so a title/description containing $ (every
        # dollar figure this channel writes about) or a literal " gets
        # re-parsed as shell syntax by the runner's shell. Confirmed: it
        # silently ate every dollar amount in early publishes, then hard
        # crashed the first time a description also contained an embedded
        # quote. "$TITLE"/"$DESCRIPTION" below are normal bash variable
        # expansions -- their contents are never re-interpreted as script.
        run: |
          args=(--slug "$SLUG" --title "$TITLE" --description "$DESCRIPTION")
          if [ "$SKIP_INSTAGRAM" = "true" ]; then args+=(--no-instagram); fi
          if [ "$SKIP_TIKTOK" = "true" ]; then args+=(--no-tiktok); fi
          python tools/publish_now.py "${args[@]}"
