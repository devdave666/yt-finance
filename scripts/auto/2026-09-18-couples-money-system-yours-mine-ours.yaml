beats:
- id: b01
  scene: s_b01
  say: This is the simplest money system for couples who never want to fight about
    money.
- id: b02
  scene: s_b02
  say: Sarah and Mike fell in love. Soon, two paychecks became one shared life.
- id: b03
  scene: s_b03
  say: But love doesn't decide who pays the rent, whose card covers groceries, or
    where the vacation money goes.
  tone: negative
- id: b04
  scene: s_b04
  say: So they use one simple system. Yours. Mine. Ours.
- id: b05
  scene: s_b05
  say: First, ours. One shared account covers rent, bills, groceries, everything they
    use together.
- id: b06
  scene: s_b06
  say: They each contribute an amount they agree on, split equally or based on income.
- id: b07
  scene: s_b07
  say: Next, yours and mine. Each keeps personal spending money. Coffee, hobbies,
    little treats.
- id: b08
  scene: s_b08
  say: No permission, no guilt, no interrogation.
- id: b09
  scene: s_b09
  say: Finally, our future. They automate money toward the goals they share.
- id: b10
  scene: s_b10
  say: An emergency fund. A home. A trip. Long-term investing.
- id: b11
  scene: s_b11
  say: Once a month, they have a twenty-minute money date.
- id: b12
  scene: s_b12
  say: They review what they spent, talk about what's next, and agree on where they're
    headed.
- id: b13
  scene: s_b13
  say: No blame. No surprises. Just one shared plan.
- id: b14
  scene: s_b14
  say: Because couples don't need to combine every dollar. They need to agree on what
    every dollar is for.
- id: b15
  scene: s_b15
  say: If you and your partner have ever argued about money, try this system, tell
    us how it goes in the comments, and save this for your next money date.
