title: Why Paying Off Debt Can Hurt Your Credit Score
slug: 2026-09-17-credit-score-drop-paid-off-debt
format: short
beats:
- id: b01
  say: You just paid off your last loan. So why did your credit score go down?
  scene: s_b01
- id: b02
  say: No, it’s not a mistake. The system is designed to see that as a new risk.
  tone: negative
  scene: s_b02
- id: b03
  say: First, scoring models want to see a 'credit mix'—different types of debt at
    once.
  scene: s_b03
- id: b04
  say: When you close your last loan, your 'mix' is gone. To the algorithm, that's
    a downgrade.
  tone: negative
  scene: s_b04
- id: b05
  say: Second, about fifteen percent of your score is the average age of your accounts.
  scene: s_b05
- id: b06
  say: Closing your oldest account, even when it's paid off, can lower that average
    instantly.
  tone: negative
  scene: s_b06
- id: b07
  say: So you did the responsible thing, and the system flagged you as less reliable.
    It's not fair, it's just how the machine works.
  scene: s_b07
- id: cta007
  scene: s_cta007
  say: Which side are you on? Comment below, and save this before you need it.
