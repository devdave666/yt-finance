scenes:
  s_b01:
    bg: Wide low-angle shot, golden late-afternoon sun raking across the facade.
      Sarah stands on the cracked front path of a dilapidated two-story Victorian
      house -- peeling paint, an overgrown lawn -- holding up a single brass door
      key toward the camera, determined expression. Deep, saturated blue sky
      behind the roofline, rich warm golden light on Sarah and the house, high
      contrast and vivid color.
  s_b02:
    bg: Close-up, warm interior car light against a cool blue dusk outside the
      window. Three identical real-estate inspection folders sit stacked on the
      passenger seat, one lying open. Sarah is visible blurred in the background,
      behind the wheel, looking at the house through the windshield.
  s_b03:
    bg: Low angle close-up, flashlight beam cutting through a damp basement.
      Visible dark mold patches climb a concrete foundation wall. Sarah crouches
      at the edge of frame, inspecting it, flashlight in hand. Cool blue-green
      ambient light contrasted with the warm flashlight beam.
  s_b04:
    bg: Exterior, low angle looking straight up at an aging shingled roof --
      curled and missing shingles clearly visible -- against a vivid, deep blue
      sky. Warm golden sunlight rakes sideways across the shingles, high contrast,
      richly saturated color.
  s_b05:
    bg: Medium shot, interior. A dated late-1980s kitchen -- avocado-green
      cabinets, worn laminate countertops, boxy beige appliances. Sarah stands in
      the doorway, arms crossed, assessing it with a faint smile. Warm afternoon
      light pours through a window on one side, cool shadow on the other.
  s_b06:
    bg: 'Extreme close-up on a printed real-estate listing sheet on a car
      dashboard, clearly printed with "LISTED: $180,000". Warm interior light,
      soft blue dusk visible through the windshield behind it.'
  s_b07:
    bg: 'Close-up, over-the-shoulder behind Sarah''s hand as she signs a document
      on a wooden desk, clearly printed with "OFFER: $142,000". Warm desk-lamp
      light, confident posture.'
  s_b08:
    bg: 'Extreme close-up on a closing document stamped "CLOSED" in bold red ink,
      a pen resting across it, two calendar dates visible beside it two days
      apart. Warm lamp light, rich mahogany desk surface.'
  s_b09:
    bg: 'Medium shot, interior of the same kitchen mid-renovation -- cabinets
      torn out, exposed subfloor. Sarah stands holding a contractor''s estimate
      sheet clearly printed with "REPAIRS: $38,000". Warm sunbeams cut through
      drifting construction dust from a bare window.'
  s_b10:
    bg: 'Close-up on a simple handwritten ledger card resting on a workbench,
      clearly written "TOTAL: $180,000", surrounded by paint cans and tools.
      Warm golden work-light, high contrast.'

  s_b11:
    bg: 'Wide shot down a residential street lined with freshly renovated houses,
      lush green lawns, deep saturated blue sky. A "SOLD" yard sign in the nearest
      lawn clearly reads "SOLD: $265,000". Vivid, high-contrast color, warm
      sunlight.'
  s_b12:
    bg: Medium shot, interior. The kitchen and living room now fully renovated
      and bright. Sarah stands with arms crossed by the window, golden hour light
      flooding in, a knowing half-smile, looking out at the street.
  s_b13:
    bg: Close-up, eye-level. Sarah sits across a bank desk, signing a document,
      calm confident smile. A loan officer's hands are visible across the desk,
      out of focus. Cool blue light from a window blends with warm desk-lamp
      light.
  s_b14:
    bg: 'Extreme close-up on a refinance approval document on the bank desk,
      clearly printed with two lines: "APPRAISED VALUE: $265,000" and "CASH OUT:
      $190,000". Warm desk-lamp light, sharp focus.'
  s_b15:
    bg: Wide low-angle shot. Sarah stands on the renovated house's front porch,
      one hand resting on a "FOR RENT" yard sign, lush green lawn, deep blue sky,
      warm golden light washing over the freshly painted facade.
  s_b16:
    bg: 'Close-up on a bank statement on a kitchen table, clearly printed with
      two matching line items: "RENT DEPOSIT: $2,150" and "MORTGAGE PAYMENT:
      $1,810". Sarah''s finger rests beside the lines. Warm kitchen light.'
  s_b17:
    bg: 'Extreme close-up on the same bank statement, tighter now on a bold
      positive balance line reading "+$340". Warm light, Sarah''s finger tapping
      it, faint satisfied smile just in frame.'
  s_b18:
    bg: 'Medium shot at a home office desk. Sarah looks over a plain sheet of
      paper reading only "TOTAL RETURNED: $180,000" -- the rest of the page is
      blank white space, no other headings, labels, columns, or lines of text
      anywhere on the page. Satisfied expression. Warm lamp light on the desk,
      cool blue dusk through the window behind her.'
  s_b19:
    bg: 'Close-up on a plain summary sheet, tighter now on one single highlighted
      line reading "+$10,000 PROFIT", Sarah''s pen circling it. The rest of the
      page is blank white space -- no other headings, labels, columns, or lines
      of text anywhere on the page, just this one circled phrase. Warm desk-lamp
      light.'
  s_b20:
    bg: Wide low-angle shot. The fully renovated house exterior, lush green lawn,
      a small "RENTED" sign near the walkway, deep saturated blue sky, warm
      golden sunlight. Sarah stands proudly on the lawn looking back at the
      house.
  s_b21:
    bg: Tight close-up, eye-level. Sarah looks directly into the camera with a
      warm, knowing smile, the renovated house softly blurred behind her, golden
      hour light, rich saturated color.
  s_b22:
    bg: Medium shot, eye-level. Sarah faces the camera directly, one hand
      gesturing outward in a warm, inviting motion, confident smile, the
      renovated house glowing warmly behind her in late golden light, deep blue
      sky above the roofline. She stands on a plain, smooth, continuous
      poured-concrete path -- no patterned pavers, no tiling, one unbroken
      surface with no seams or texture breaks.
beats:
- id: b01
  scene: s_b01
  say: The house nobody wanted made her rich.
- id: b02
  scene: s_b02
  say: Three other buyers had already walked away, right after the inspection.
- id: b03
  scene: s_b03
  say: First it was the basement -- mold, climbing straight up the foundation
    wall.
- id: b04
  scene: s_b04
  say: Then the roof. Maybe two years left on it, at best.
- id: b05
  scene: s_b05
  say: And the kitchen hadn't been touched since the nineteen eighties.
- id: b06
  scene: s_b06
  say: The house was listed at one hundred eighty thousand dollars.
- id: b07
  scene: s_b07
  say: She looked past all of it, and offered one hundred forty two thousand.
- id: b08
  scene: s_b08
  say: The seller said yes. They closed two days later.
- id: b09
  scene: s_b09
  say: Fixing it up properly would run about thirty eight thousand dollars.
- id: b10
  scene: s_b10
  say: Add that to what she paid, and she was all in for one hundred eighty
    thousand.
- id: b11
  scene: s_b11
  say: Renovated houses on that same street were already selling for two hundred
    sixty five thousand.
- id: b12
  scene: s_b12
  say: Everyone assumed she'd flip it, sell it, and pocket the difference.
- id: b13
  scene: s_b13
  say: She didn't sell it. She refinanced it.
  emphasis: true
- id: b14
  scene: s_b14
  say: The new appraisal came back at two hundred sixty five thousand, and she
    pulled one hundred ninety thousand out in cash.
- id: b15
  scene: s_b15
  say: And she kept the house.
- id: b16
  scene: s_b16
  say: She rented it out, and the rent covers the entire mortgage payment.
- id: b17
  scene: s_b17
  say: There's still three hundred forty dollars left over, every single month.
- id: b18
  scene: s_b18
  say: She got back the full one hundred eighty thousand she'd put in.
- id: b19
  scene: s_b19
  say: Plus an extra ten thousand dollars, sitting in her account.
- id: b20
  scene: s_b20
  say: And she still owns a two hundred sixty five thousand dollar house, paying
    her every single month.
- id: b21
  scene: s_b21
  say: Ugly houses don't stay ugly. They stay cheap -- until someone fixes what
    everyone else is afraid to.
- id: b22
  scene: s_b22
  say: Follow Anti Broke for one real money story like this, every single day.
