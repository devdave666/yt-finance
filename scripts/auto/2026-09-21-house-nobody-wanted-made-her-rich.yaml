    anchor: center
    voice: Aoede
    look: 'Sarah, the channel''s recurring host: a sharp, confident woman with long
      dark hair, wearing a tailored navy three-piece suit, a red silk tie, a crisp
      white dress shirt, and gold accents (a wristwatch, a ring) -- authority and
