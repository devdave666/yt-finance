slug: 2026-09-18-private-equity-explained-levels
title: Private Equity Explained Like A Video Game
format: short
beats:
- id: b01
  say: This is how five pounds turns into ten thousand pounds, completely legally.
  scene: s_b01
- id: b02
  say: Meet Bill. He thinks you're smart with money.
  scene: s_b02
- id: b03
  say: He hands you five pounds. He wants more back.
  scene: s_b03
- id: b04
  say: You agree. Congratulations, that's private equity. Level one.
  scene: s_b04
- id: b05
  say: Level two. Jeff hears about it, and gives you five pounds too.
  scene: s_b05
- id: b06
  say: Now you've got ten pounds. Bill and Jeff are called investors.
  scene: s_b06
- id: b07
  say: You lock it away somewhere safe. That's called a fund.
  scene: s_b07
- id: b08
  say: Level three. You use their money to buy something real.
  scene: s_b08
- id: b09
  say: Ryanair. Ten pounds buys the whole airline.
  scene: s_b09
- id: b10
  say: You get to work. Fewer delays. Cleaner planes.
  scene: s_b10
- id: b11
  say: You also quietly let go of a thousand people.
  tone: negative
  scene: s_b11
- id: b12
  say: Level four. Everyone loves the airline now.
  scene: s_b12
- id: b13
  say: So you sell the whole company for thirty pounds.
  scene: s_b13
- id: b14
  say: Bill gets his ten back. Jeff gets his ten back.
  scene: s_b14
- id: b15
  say: You keep the rest. Level five is where it gets serious.
  scene: s_b15
- id: b16
  say: You hire a team to hunt for undervalued companies.
  scene: s_b16
- id: b17
  say: They find ten of them. Twenty investors, Bill included, want in.
  scene: s_b17
- id: b18
  say: In total, they hand you one hundred pounds.
  scene: s_b18
- id: b19
  say: The ten companies cost one thousand pounds. You're short by nine hundred.
  scene: s_b19
- id: b20
  say: So you borrow it. Nine hundred pounds, straight from the bank.
  scene: s_b20
- id: b21
  say: A hundred pounds of theirs, nine hundred of the bank's. You buy all ten.
  scene: s_b21
- id: b22
  say: You fix them up, and sell the lot for ten thousand pounds.
  scene: s_b22
- id: b23
  say: Everyone gets paid. But most of that money was never yours to begin with.
  scene: s_b23
- id: cta023
  scene: s_cta023
  say: Which side are you on? Comment below, and save this before you need it.
