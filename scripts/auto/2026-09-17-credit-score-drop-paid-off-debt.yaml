  s_b03:
    bg: 'Wide shot. Sarah stands beside a large, glowing monitor on a dark marble
      wall. The monitor displays a clean pie chart graphic under the heading ''CREDIT
      MIX: HEALTHY''. The chart has two distinct, brightly colored sections labeled
      ''REVOLVING CREDIT (Cards)'' and ''INSTALLMENT LOAN (Auto/Student)''.'
  s_b04:
    bg: 'Extreme close-up on the monitor from the previous shot. The ''INSTALLMENT
