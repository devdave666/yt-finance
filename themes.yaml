# The channel's content space. The generator reads this, picks the next topic
# (round-robin, skipping anything used in the last `cooldown` videos), decides
# explainer vs skit, and writes a full script YAML. Edit this file to steer the
# channel; everything downstream is hands-off.
#
# Format (explainer/skit) and structural angle (myth-vs-reality, then-vs-now,
# a relatable mistake, two-paths...) are FORCED on rotation in generate.py,
# not left to the model -- across 40+ real generations it picked "explainer"
# + "state a fact next to a chart" every single time otherwise. Don't remove
# that rotation without something else in its place; it's the fix for the
# channel visibly feeling repetitive.

channel: "Anti Broke (@AntiBrokee)"

niche: >
  Personal finance for people who want to stop being broke -- but the LESS
  obvious stuff. Not "what is a budget". Three pillars, all in rotation: (1)
  the mechanics and gotchas most people never had explained -- how a rule
  actually works, the trap hidden in the fine print, the counterintuitive
  thing that's true anyway; (2) the compounding/market-history content real
  finance creators go viral with -- historical stock/index runs, the math of
  time in the market, viral market stats, in strictly past-tense framing;
  (3) everyday money psychology and relatable comparisons -- lifestyle creep,
  dark-pattern subscriptions and BNPL, the mistake a normal person makes
  without noticing. One sharp idea per short, evergreen, advertiser-safe, no
  forward-looking buy advice, and no two videos should feel like the same
  template with the numbers swapped.

voice: >
  A sharp market analyst who's a little pissed off on the viewer's behalf.
  Calm, dry, specific -- the edge comes from exposing how rigged the fine print
  is, never from jokes or mocking the viewer. Open on the surprising fact, then
  show the mechanism. Zero fluff, zero hype. Every line either lands a number or
  a turn.

# Hard rules the generator must follow (also enforced in generate.py):
rules:
  - Never tell the viewer to buy a specific stock, crypto, fund, or product NOW, and never promise future returns.
  - What-if-you-invested / market-history content IS allowed -- it may name a real, well-known company,
    index, or asset (Apple, Amazon, Bitcoin, the S&P 500, ...), but ONLY as a strictly past-tense
    historical fact (would have grown to roughly $X), using round, widely-cited public figures -- never
    framed as advice for what to buy today, and it must land on a lesson (time in the market, compounding,
    diversification), not a buy signal.
  - Never promise returns or use hype ("get rich", "this one trick", "banks hate this").
  - No individualized investment, tax, or legal advice -- general education only.
  - Keep it accurate. If a number or rule is cited, it must be correct (or, for historical "what if"
    figures, a well-known rounded figure -- say "roughly" / "about", never a suspiciously precise number).
  - Sarcasm is aimed at systems and fine print, never at the viewer.
  - Every video ends on a calm, useful takeaway (dry, not a hard sell).

formats: [explainer, skit]     # the generator picks one per video based on the topic
cooldown: 26                   # don't reuse a topic until this many videos have passed

# Ordered strongest-hook-first (the generator works down the list, least-
# recently-used first, ties broken by this order). Each one should be
# genuinely "wait, WHAT" -- lead with the number or the trick.
topics:
  # "What if you'd invested" / market-history content -- the viral-finance-creator pillar. Real, well-known
  # companies and assets, strictly past tense, round widely-cited figures, always lands on a lesson (time in
  # the market / compounding / diversification), never a buy signal for today. Listed first so it actually
  # surfaces soon instead of losing every tiebreak to the long tail of never-yet-used fine-print topics below.
  - What $1,000 in Apple stock at its 1980 IPO would be worth today -- and why almost nobody held it that long
  - What $1,000 in Amazon at its 1997 IPO would be worth today -- it fell over 90% twice on the way there
  - Missing just the 10 best days in the stock market over 20 years can cut your total return roughly in half
  - What $1,000 in Bitcoin in 2010 would be worth today -- and the guy who spent 10,000 of them on two pizzas
  - Warren Buffett made over 99% of his net worth after age 50 -- compounding needs time more than it needs skill
  - $100 a month invested from age 25 to 35 then left alone beats $100 a month invested from 35 to 65
  - Berkshire Hathaway turned $1,000 into roughly $30 million since 1965 -- at "only" about 20% a year, compounded
  - The S&P 500 has never lost money over any historical 20-year holding period, including through every crash
  - Cash sitting under the mattress for 30 years loses most of its buying power to inflation alone
  - Trying to time the market historically loses to just staying invested the whole time, most years running
  - What $1,000 in Netflix at its 2002 IPO would be worth today -- through a stock that also crashed 80% in 2011
  - Dollar-cost averaging into an index fund beats most people who try to pick individual winning stocks
  - The Rule of 72 says money doubling every 8 years (9% return) turns $10,000 into over $150,000 in 30 years
  - GameStop's 2021 short squeeze made a few people millions and wiped out most who bought in after the spike

  - Banks reorder your daily purchases largest-first so more of them overdraft -- and each overdraft is ~$35
  - Deferred-interest "same as cash" financing -- miss the payoff date by a day and months of interest hit retroactively
  - Paying only the minimum on a $5,000 credit card at 24% APR takes over 20 years and roughly doubles what you owe
  - Carry any balance on a credit card and you lose the interest-free grace period -- new purchases start charging from day one
  - A credit score has nothing to do with your income, savings, or net worth -- a millionaire can have a bad one
  - Closing your oldest credit card can drop your score, because it shortens your average account age
  - Balance transfers advertised at zero-percent APR almost always carry a 3 to 5 percent upfront fee people forget to count
  - Whole life insurance can cost 10x term for the same coverage, with most of the extra going to fees and commission
  - The 0% long-term capital gains bracket -- in a low-income year you can sell winners and owe zero federal tax
  - An HSA is the only triple-tax-free account -- and if you invest it instead of spending it, it's a stealth retirement fund
  - A 401k match can have a vesting schedule -- leave a year too early and you forfeit thousands in "free" money
  - Your 401k's expense ratio, even at 1%, can quietly eat close to a third of your lifetime returns
  - FDIC insurance covers far more than $250k at one bank if the money sits in different ownership categories
  - Credit utilization is scored per card, not just overall -- one maxed card can tank your score while your total looks fine
  - Beneficiary designations on your accounts override whatever your will says -- an ex can still inherit
  - The wash-sale rule -- claim a tax loss then rebuy within 30 days and the IRS disallows the whole deduction
  - Sequence-of-returns risk -- a market crash in your first retirement years does far more damage than the same crash later
  - I bonds -- U.S. savings bonds whose rate resets with inflation, with a hard yearly purchase cap
  - Target-date funds are great inside a 401k and quietly tax-inefficient in a regular brokerage account
  - Money market funds and high-yield savings pay similar rates but one is FDIC-insured and one isn't
  - Municipal bond interest is federal-tax-free, so a 3.5% muni can beat a 4.5% taxable bond after tax
  - A Roth IRA's quiet feature -- your contributions (not the gains) can come back out anytime, tax and penalty free
  - Your effective tax rate is much lower than your bracket -- a raise into a new bracket never lowers your take-home
  - Paying rent on time builds zero credit history unless you specifically enroll in a rent-reporting service
  - Brokered CDs often pay more than bank CDs but trade like bonds -- sell early and you can take a loss
  - A 15-year vs a 30-year mortgage -- the rate is lower but the payment jump is bigger than most people expect
  - A "no-fee" checking account still earns the bank money -- on your idle balance and on interchange when you swipe
  - Overdraft "protection" is usually an opt-in short-term loan at an effective APR in the triple digits

  # Everyday money psychology, comparisons and relatable/skit-friendly scenarios -- deliberately NOT
  # another "$X in [stock]" template. Real finance creators live here as much as in market stats.
  - Cutting the daily coffee doesn't fix a budget -- the math on why income and big fixed costs matter far more than small habits
  - Two people earning the same salary can retire a decade apart -- the gap is entirely what happens to the raise, not the raise itself
  - Shrinkflation -- the same price for quietly less product -- has cost the average household real money without a single price tag changing
  - Payroll withholding makes a new job's first paycheck feel smaller than the salary implied, and almost nobody explains why in advance
  - Gym memberships and streaming trials are designed to auto-renew because cancelling is deliberately made a few steps harder than signing up
  - Splitting rent 50/50 on unequal incomes isn't actually fair -- the math on splitting by income percentage instead
  - Treat-yourself purchases each feel harmless alone, but the pattern is usually the single biggest leak in a normal budget
  - A store's "20% off your first purchase" card is a discount only on something you were already buying -- otherwise it's a new expense with a bow on it
  - Buy-now-pay-later's "four easy payments" reframes a purchase as smaller than it is, and the missed-payment fees can erase the entire convenience
  - Lifestyle creep -- a raise that quietly gets absorbed into slightly nicer everyday spending before you ever notice it arrived
  - Co-signing a loan for family puts the debt on your own credit report -- if they miss one payment, it's your score that drops, not just theirs
  - Free-trial subscriptions are a business model built on people forgetting to cancel before the real charge hits
  - Limited-time and only-3-left urgency tags are often untrue and tested specifically because they still work on shoppers who know that
  - A used car's true cost per mile is usually higher than people assume once depreciation is counted, not just gas and insurance
  - Suggested tip screens crept from 15-20% to 25-30% defaults after contactless payment made tipping a tap instead of a decision
  - The "minimum payment" number on a bill is calculated to look small on purpose -- it is not what a responsible payment looks like
