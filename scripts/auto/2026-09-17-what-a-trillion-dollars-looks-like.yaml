narrator:
  voice: Aoede
cinematic: true
caption_style: cinematic
scenes:
  s_b01:
    bg: A stark white news studio. Sarah stands at a sleek, minimalist news desk,
      looking directly into the camera with an intense, serious expression. The lighting
      is bright and clinical, like a breaking news report. Behind her, a massive screen
      is blank white.
  s_b02:
    bg: 'Same news studio. Sarah holds up a single, crisp one-dollar bill. The screen
      behind her flashes with two numbers side-by-side: a small ''$1,000,000'' and
      a massive, screen-filling ''$1,000,000,000''.'
  s_b03:
    bg: 'A cramped, dimly lit kitchen at night. Sarah sits at a small table, head
      in one hand, staring at a single piece of paper: an eviction notice. A red stamp
      on it clearly reads ''FINAL NOTICE''. Her expression is one of utter exhaustion
      and stress.'
  s_b04:
    bg: The same kitchen, but now it's bright with morning light. Sarah looks relieved.
      She's holding a smartphone displaying a banking app. The screen shows a balance
      of '$1,000.00' and a recent transaction for 'Rent Payment'. The notice on the
      table is now stamped with 'PAID' in black ink.
  s_b05:
    bg: A clean, modern home office. Sarah sits comfortably in a chair, calmly looking
      at a laptop. On the screen is a clean, simple investment portfolio dashboard
      with a large total value reading '$1,000,000'. A small alert indicates '+ $850
      Dividend Received'.
  s_b06:
    bg: Close on Sarah's face in the same home office. She takes a calm sip of coffee,
      a small, knowing smile on her face. The background is softly blurred. The feeling
      is one of peace and security, not extravagance.
  s_b07:
    bg: Back in the stark white studio. Sarah stands before the giant screen, which
      now shows a photorealistic animation of a single $1,000 stack of cash burning
      away, then being replaced by another, over and over.
  s_b08:
    bg: The screen behind Sarah changes to a massive digital calendar. The year display
      is rapidly spinning forward, starting from the current year and blurring as
      it accelerates past 3000, 4000, stopping on the year '4762'. Sarah gestures
      to it, looking unimpressed.
  s_b09:
    bg: 'Sarah stands in front of a massive, holographic globe of the Earth. As she
      speaks, the country of Switzerland is highlighted in glowing blue. A data overlay
      appears next to it with the text ''GDP: ~$900 Billion''.'
  s_b10:
    bg: Sarah is back at the kitchen table from the earlier scenes. She places a hand
      flat on the table, looking directly at the camera, her expression now encouraging
      and direct.
  s_b11:
    bg: Tight shot on Sarah's face, now in the bright, sunlit kitchen. She gives a
      slight, confident nod. The light is warm and hopeful. The background is soft,
      focusing entirely on her reassuring expression.
  s_cta011:
    bg: Sarah closes a leather folder on her desk and looks directly at camera with
      a warm, knowing smile, one hand open toward the viewer in an inviting gesture.
      Warm desk-lamp light, soft blue dusk through the window behind her.
